<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ürün Kataloğu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --paper: #F7F1E4;
      --card: #FFFDF6;
      --ink: #21301F;
      --ink-soft: #5B6B54;
      --line: #E4D9C3;
      --tomato: #B23A2E;
      --tomato-dark: #8F2E24;
      --mustard: #C99A2E;
      --whatsapp: #25D366;
      --font-display: "Fraunces", Georgia, serif;
      --font-body: "Inter", -apple-system, "Segoe UI", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      font-family: var(--font-body);
      background: var(--paper);
      margin: 0;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- Üst çubuk: Trendyol tarzı sabit başlık ---------- */
    .top-bar {
      position: sticky; top: 0; z-index: 400;
      background: var(--ink); color: var(--paper);
      padding: 14px 16px 12px;
    }
    .top-bar-inner {
      display: flex; align-items: center; justify-content: space-between;
      max-width: 1000px; margin: 0 auto 12px;
    }
    .brand-mini { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-mini img {
      width: 34px; height: 34px; border-radius: 8px; object-fit: cover; display: none; flex-shrink: 0;
    }
    .brand-mini h1 {
      font-family: var(--font-display); font-weight: 600; font-size: 18px;
      margin: 0; letter-spacing: 0.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .cart-icon-btn {
      position: relative; background: var(--tomato); border: none; color: #fff;
      width: 42px; height: 42px; border-radius: 10px; cursor: pointer; font-size: 17px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .cart-icon-badge {
      position: absolute; top: -6px; right: -6px;
      background: var(--mustard); color: var(--ink);
      font-size: 10px; font-weight: 700; min-width: 18px; height: 18px;
      border-radius: 9px; display: none; align-items: center; justify-content: center;
      padding: 0 4px; border: 2px solid var(--ink);
    }
    .search-row { max-width: 1000px; margin: 0 auto; }
    .search-box {
      width: 100%; padding: 12px 16px; border-radius: 10px;
      border: none; font-size: 15px;
      background: var(--card); color: var(--ink); font-family: var(--font-body);
    }
    .search-box::placeholder { color: #A79D87; }
    .search-box:focus { outline: 2px solid var(--mustard); }

    .category-chips {
      display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 0;
      max-width: 1000px; margin: 0 auto; scrollbar-width: none;
    }
    .category-chips::-webkit-scrollbar { display: none; }
    .category-chip {
      flex-shrink: 0; padding: 7px 14px; border-radius: 20px; border: 1.5px solid #3B4D38;
      background: transparent; color: var(--paper); font-size: 12.5px; font-weight: 600;
      cursor: pointer; white-space: nowrap; font-family: var(--font-body);
    }
    .category-chip.active { background: var(--mustard); border-color: var(--mustard); color: var(--ink); }

    /* ---------- Ana alan / ürün ızgarası ---------- */
    .main-area { padding: 18px 16px 100px; max-width: 1000px; margin: 0 auto; }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    @media (min-width: 620px) {
      .product-grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
    }
    .product-card {
      background: var(--card); border-radius: 12px; overflow: hidden;
      box-shadow: 0 1px 3px rgba(33, 48, 31, 0.08);
      display: flex; flex-direction: column;
    }
    .product-visual {
      aspect-ratio: 1 / 1; width: 100%; display: flex; align-items: center; justify-content: center;
      font-size: 30px; color: #fff; overflow: hidden;
    }
    .product-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .product-name {
      font-size: 13.5px; font-weight: 600; margin: 0; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      min-height: 2.6em;
    }
    .product-price { font-size: 14.5px; color: var(--tomato-dark); font-weight: 700; margin: 0; font-variant-numeric: tabular-nums; }
    .product-unit { font-size: 11px; color: var(--ink-soft); font-weight: 500; }

    .qty-stepper { display: flex; align-items: center; gap: 6px; margin-top: auto; }
    .qty-stepper button {
      min-width: 30px; height: 30px; padding: 0 8px; border-radius: 7px; border: 1.5px solid var(--line);
      background: var(--paper); font-size: 13px; cursor: pointer; color: var(--tomato-dark);
      font-family: var(--font-body); font-weight: 700; white-space: nowrap;
    }
    .qty-stepper button.minus-btn { min-width: 30px; width: 30px; padding: 0; font-size: 16px; }
    .qty-stepper button.add-btn { background: var(--tomato); border-color: var(--tomato); color: #fff; flex: 1; }
    .qty-stepper span { min-width: 18px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 13px; }

    .highlight-section { margin-bottom: 8px; }
    .highlight-title {
      font-family: var(--font-display); font-weight: 600; font-style: italic;
      font-size: 15px; color: var(--tomato-dark); margin: 0 0 8px;
    }
    .highlight-title.discount { color: var(--tomato); }
    .highlight-scroll {
      display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none;
    }
    .highlight-scroll::-webkit-scrollbar { display: none; }
    .highlight-card {
      flex-shrink: 0; width: 128px; background: var(--card); border-radius: 12px; overflow: hidden;
      box-shadow: 0 1px 3px rgba(33, 48, 31, 0.08);
    }
    .highlight-visual {
      aspect-ratio: 1 / 1; width: 100%; display: flex; align-items: center; justify-content: center;
      font-size: 24px; color: #fff; overflow: hidden;
    }
    .highlight-body { padding: 8px 10px 10px; }
    .highlight-name {
      font-size: 12px; font-weight: 600; margin: 0 0 4px; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.4em;
    }
    .highlight-price-old { font-size: 10.5px; color: var(--ink-soft); text-decoration: line-through; }
    .highlight-price-new { font-size: 13px; font-weight: 700; color: var(--tomato-dark); }
    .highlight-add-btn {
      width: 100%; margin-top: 6px; padding: 6px; border-radius: 6px; border: none;
      background: var(--tomato); color: #fff; font-size: 11.5px; font-weight: 700; cursor: pointer;
    }
    .category-label {
      grid-column: 1 / -1;
      display: flex; align-items: center; gap: 10px;
      font-family: var(--font-display); font-weight: 600; font-style: italic;
      font-size: 15px; color: var(--tomato-dark);
      margin: 10px 0 2px;
    }
    .category-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .category-label:first-child { margin-top: 0; }

    .empty-state, .error-state {
      grid-column: 1 / -1; text-align: center; color: var(--ink-soft); padding: 48px 24px;
      font-family: var(--font-display); font-style: italic; font-size: 16px;
    }
    .loading { grid-column: 1 / -1; text-align: center; padding: 48px 20px; color: var(--ink-soft); }

    /* ---------- Sepet penceresi: SİPARİŞ FİŞİ ---------- */
    .sheet-overlay {
      display: none; position: fixed; inset: 0; background: rgba(33, 48, 31, 0.45);
      z-index: 900; align-items: flex-end; justify-content: center;
    }
    .sheet-overlay.show { display: flex; }
    .receipt {
      background: var(--card); width: 100%; max-width: 460px;
      max-height: 90vh; overflow-y: auto; position: relative;
      padding: 26px 22px 24px;
      font-family: var(--font-body);
    }
    .receipt::before {
      content: ""; position: absolute; top: -10px; left: 0; right: 0; height: 10px;
      background:
        linear-gradient(-45deg, var(--card) 50%, transparent 50%) 0 0 / 16px 20px repeat-x,
        linear-gradient(45deg, var(--card) 50%, transparent 50%) 0 0 / 16px 20px repeat-x;
    }
    .receipt-title {
      text-align: center; font-family: var(--font-display); font-weight: 700;
      font-size: 19px; letter-spacing: 0.5px; margin: 0 0 3px;
    }
    .receipt-subtitle {
      text-align: center; font-size: 11px; color: var(--ink-soft);
      letter-spacing: 1.5px; text-transform: uppercase; margin: 0 0 16px;
    }
    .sheet-close {
      position: absolute; top: 16px; right: 18px; background: none; border: none;
      font-size: 22px; color: var(--ink-soft); cursor: pointer; line-height: 1;
    }
    .receipt-rule { border: none; border-top: 1.5px dashed var(--line); margin: 14px 0; }
    .cart-line-row {
      display: flex; align-items: baseline; justify-content: space-between;
      padding: 8px 0; font-size: 14px;
    }
    .cart-line-name { font-weight: 600; }
    .cart-line-meta { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
    .cart-line-total { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .empty-cart-note { text-align: center; color: var(--ink-soft); font-size: 13px; font-style: italic; padding: 6px 0 4px; }

    .step-label {
      font-family: var(--font-display); font-weight: 600; font-style: italic;
      font-size: 14px; margin: 4px 0 10px; color: var(--tomato-dark);
    }
    .delivery-choice-row { display: flex; gap: 10px; margin-bottom: 14px; }
    .delivery-choice-btn {
      flex: 1; padding: 14px 8px; border-radius: 10px; border: 1.5px solid var(--line);
      background: var(--paper); text-align: center; cursor: pointer;
      font-size: 12.5px; font-weight: 600; color: var(--ink-soft);
    }
    .delivery-choice-btn.active { border-color: var(--tomato); background: #FBEEEC; color: var(--tomato-dark); }
    .delivery-choice-btn i { display: block; font-size: 20px; margin-bottom: 6px; }

    .address-input {
      width: 100%; padding: 12px; border-radius: 8px; border: 1.5px solid var(--line);
      font-size: 13.5px; margin-top: 10px; min-height: 58px; font-family: var(--font-body);
      background: var(--paper); color: var(--ink); resize: vertical;
    }
    .address-input::placeholder { color: #A79D87; }
    .map-btn {
      width: 100%; padding: 12px; border-radius: 8px; border: 1.5px dashed var(--tomato);
      background: #FBEEEC; color: var(--tomato-dark); font-weight: 600; font-size: 13.5px;
      margin-top: 4px; cursor: pointer; font-family: var(--font-body);
    }
    #deliveryMap { height: 240px; border-radius: 8px; margin-top: 10px; display: none; border: 1.5px solid var(--line); }

    .fee-summary { margin-top: 8px; font-size: 14px; }
    .fee-summary div { display: flex; justify-content: space-between; margin: 5px 0; font-variant-numeric: tabular-nums; }
    .fee-summary .grand-total {
      font-weight: 700; font-size: 17px; color: var(--ink);
      border-top: 1.5px dashed var(--line); margin-top: 8px; padding-top: 10px;
    }
    .send-order-btn {
      width: 100%; padding: 15px; border-radius: 9px; border: none;
      background: var(--whatsapp); color: #fff; font-weight: 700; font-size: 15px;
      margin-top: 16px; cursor: pointer; font-family: var(--font-body);
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .send-order-btn:disabled { background: #C9CDC5; cursor: not-allowed; }
    .warn-text { color: var(--tomato-dark); font-size: 12px; margin-top: 8px; line-height: 1.4; }
    .receipt-footer-rule {
      margin-top: 20px; height: 14px;
      background: repeating-linear-gradient(90deg, var(--ink) 0 1.5px, transparent 1.5px 4px);
      opacity: 0.55;
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <div class="top-bar-inner">
      <div class="brand-mini">
        <img id="businessLogoImg" src="" alt="" />
        <h1 id="businessNameHeader">Ürün Kataloğu</h1>
      </div>
      <button id="openCartBtn" class="cart-icon-btn" aria-label="Sepetim">
        <i class="fa-solid fa-basket-shopping" aria-hidden="true"></i>
        <span id="cartBarCount" class="cart-icon-badge">0</span>
      </button>
    </div>
    <div class="search-row">
      <input id="searchBox" class="search-box" type="text" placeholder="Ürün ara..." style="display:none;" />
    </div>
    <div id="categoryChips" class="category-chips"></div>
  </header>

  <main class="main-area">
    <div id="newProductsSection" class="highlight-section" style="display:none;">
      <p class="highlight-title">🆕 Yeni Ürünler</p>
      <div id="newProductsScroll" class="highlight-scroll"></div>
    </div>
    <div id="discountSection" class="highlight-section" style="display:none;">
      <p class="highlight-title discount">🔥 İndirimde</p>
      <div id="discountScroll" class="highlight-scroll"></div>
    </div>
    <div id="content" class="product-grid">
      <div class="loading"><i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i> Ürünler yükleniyor…</div>
    </div>
  </main>

  <div id="cartSheetOverlay" class="sheet-overlay">
    <div class="receipt">
      <button class="sheet-close" id="closeCartSheetBtn" aria-label="Kapat">&times;</button>
      <p class="receipt-title">Sipariş Fişi</p>
      <p class="receipt-subtitle">sepetindekiler</p>

      <div id="cartLinesList"></div>

      <div id="deliveryStep" style="display:none;">
        <hr class="receipt-rule" />
        <p class="step-label">Bilgilerin</p>
        <input id="customerNameInput" class="address-input" style="min-height:auto;" type="text" placeholder="Adın Soyadın" />
        <input id="customerPhoneInput" class="address-input" style="min-height:auto;margin-top:8px;" type="tel" placeholder="Telefon numaran (örn. 05551234567)" />

        <p class="step-label" style="margin-top:16px;">Nasıl teslim alacaksın?</p>
        <div class="delivery-choice-row">
          <div class="delivery-choice-btn active" id="choosePickupBtn">
            <i class="fa-solid fa-store" aria-hidden="true"></i>
            Gelip Alacağım
          </div>
          <div class="delivery-choice-btn" id="chooseCourierBtn">
            <i class="fa-solid fa-motorcycle" aria-hidden="true"></i>
            Kurye Getirsin
          </div>
        </div>

        <div id="courierSection" style="display:none;">
          <button id="pickOnMapBtn" class="map-btn">
            <i class="fa-solid fa-location-dot" aria-hidden="true"></i> Haritadan Konumumu İşaretle
          </button>
          <div id="deliveryMap"></div>
          <textarea id="addressTextInput" class="address-input" placeholder="Adresini yazarak da belirtebilirsin (mahalle, sokak, kapı no...)"></textarea>
          <p id="deliveryWarn" class="warn-text" style="display:none;"></p>
        </div>

        <hr class="receipt-rule" />
        <div id="feeSummary" class="fee-summary" style="display:none;">
          <div><span>Ürünler Toplamı</span><span id="feeProductTotal">0,00 ₺</span></div>
          <div id="feeDeliveryRow" style="display:none;"><span>Teslimat Ücreti</span><span id="feeDeliveryAmount">0,00 ₺</span></div>
          <div class="grand-total"><span>TOPLAM</span><span id="feeGrandTotal">0,00 ₺</span></div>
        </div>
        <p id="customerInfoWarn" class="warn-text" style="display:none;"></p>

        <button id="sendOrderBtn" class="send-order-btn">
          <i class="fa-solid fa-paper-plane" aria-hidden="true"></i> Siparişi Gönder
        </button>
        <div class="receipt-footer-rule"></div>
      </div>
    </div>
  </div>

  <script>
    let allProducts = [];
    let businessPhone = "";
    let businessName = "";
    let businessLat = null;
    let businessLng = null;
    let perKmDeliveryFee = 0;
    let currentBusinessId = "";

    // workers.dev bazı ağlarda engellenebildiği için, katalog ve sipariş
    // uç noktaları artık Firebase Cloud Functions üzerinden (Google'ın
    // kendi altyapısı, cloudfunctions.net) çalışıyor.
    const PUBLIC_CATALOG_URL = "https://us-central1-bakkal-stok.cloudfunctions.net/publicCatalog";
    const SUBMIT_ORDER_URL = "https://us-central1-bakkal-stok.cloudfunctions.net/submitOrder";
    let activeCategory = "";

    const cart = {};
    let deliveryMode = "pickup";
    let pickedLat = null;
    let pickedLng = null;
    let deliveryMap = null;
    let deliveryMarker = null;

    function getQueryParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }
    function escapeHtml(s) {
      const div = document.createElement("div");
      div.textContent = s || "";
      return div.innerHTML;
    }
    function formatTL(n) {
      return (Number(n) || 0).toLocaleString("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " ₺";
    }

    function shadeHex(hex, amount) {
      const num = parseInt(hex.replace("#", ""), 16);
      const r = Math.min(255, Math.max(0, (num >> 16) + amount));
      const g = Math.min(255, Math.max(0, ((num >> 8) & 0x00ff) + amount));
      const b = Math.min(255, Math.max(0, (num & 0x0000ff) + amount));
      return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
    }
    function applyBrandColor(color) {
      document.documentElement.style.setProperty("--tomato", color);
      document.documentElement.style.setProperty("--tomato-dark", shadeHex(color, -30));
    }

    // Kategoriye göre basit bir ikon/renk eşlemesi — gerçek ürün fotoğrafı
    // olmadığı için, en azından ızgarayı görsel olarak ayırt edilebilir yapar.
    function getCategoryVisual(category) {
      const cat = (category || "").toLowerCase();
      if (cat.includes("içecek") || cat.includes("icecek")) return { icon: "fa-bottle-water", color: "#2E6E8E" };
      if (cat.includes("süt") || cat.includes("sut") || cat.includes("peynir") || cat.includes("yoğurt") || cat.includes("yogurt")) return { icon: "fa-cheese", color: "#C99A2E" };
      if (cat.includes("şarküteri") || cat.includes("sarkuteri") || cat.includes("tavuk") || cat.includes("balık") || cat.includes("balik") || cat.includes("dana") || cat.includes("kuzu")) return { icon: "fa-drumstick-bite", color: "#B23A2E" };
      if (cat.includes("meyve") || cat.includes("sebze")) return { icon: "fa-carrot", color: "#4A7C3F" };
      if (cat.includes("temizlik") || cat.includes("deterjan")) return { icon: "fa-spray-can-sparkles", color: "#3D8B87" };
      if (cat.includes("atıştır") || cat.includes("atistir") || cat.includes("cips") || cat.includes("çikolata") || cat.includes("cikolata") || cat.includes("bisküvi") || cat.includes("biskuvi") || cat.includes("şeker") || cat.includes("seker")) return { icon: "fa-cookie", color: "#C77C2E" };
      if (cat.includes("ekmek") || cat.includes("fırın") || cat.includes("firin") || cat.includes("pasta")) return { icon: "fa-bread-slice", color: "#8B5E34" };
      if (cat.includes("bebek")) return { icon: "fa-baby", color: "#C97BA0" };
      if (cat.includes("kişisel") || cat.includes("kisisel") || cat.includes("kozmetik") || cat.includes("şampuan") || cat.includes("sampuan")) return { icon: "fa-pump-soap", color: "#7A6BA8" };
      return { icon: "fa-basket-shopping", color: "#5B6B54" };
    }

    function renderHighlightSection(sectionId, scrollId, products, isDiscount) {
      const sectionEl = document.getElementById(sectionId);
      const scrollEl = document.getElementById(scrollId);
      if (!products.length) {
        sectionEl.style.display = "none";
        return;
      }
      sectionEl.style.display = "block";
      scrollEl.innerHTML = products
        .map((p) => {
          const visual = getCategoryVisual(p.category);
          const visualHtml = p.image
            ? `<div class="highlight-visual" style="background:${visual.color};"><img src="${escapeHtml(p.image)}" alt="" style="width:100%;height:100%;object-fit:cover;" /></div>`
            : `<div class="highlight-visual" style="background:${visual.color};"><i class="fa-solid ${visual.icon}" aria-hidden="true"></i></div>`;
          const effectivePrice = isDiscount && p.discountedPrice ? p.discountedPrice : p.price;
          const priceHtml =
            isDiscount && p.discountedPrice
              ? `<p class="highlight-price-old">${formatTL(p.price)}</p><p class="highlight-price-new">${formatTL(p.discountedPrice)}</p>`
              : `<p class="highlight-price-new">${formatTL(p.price)}</p>`;
          return `
            <div class="highlight-card">
              ${visualHtml}
              <div class="highlight-body">
                <p class="highlight-name">${escapeHtml(p.name)}</p>
                ${priceHtml}
                <button class="highlight-add-btn" data-name="${escapeHtml(p.name)}" data-price="${effectivePrice}" data-unit="${p.unit}">Sepete Ekle</button>
              </div>
            </div>`;
        })
        .join("");
      scrollEl.querySelectorAll(".highlight-add-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          changeCartQty(btn.dataset.name, Number(btn.dataset.price), btn.dataset.unit, 1);
        });
      });
    }

    function renderCategoryChips(products) {
      const chipsEl = document.getElementById("categoryChips");
      const categories = [...new Set(products.map((p) => p.category || "Diğer"))].sort();
      let html = `<button class="category-chip ${activeCategory === "" ? "active" : ""}" data-cat="">Tümü</button>`;
      html += categories
        .map((cat) => `<button class="category-chip ${activeCategory === cat ? "active" : ""}" data-cat="${escapeHtml(cat)}">${escapeHtml(cat)}</button>`)
        .join("");
      chipsEl.innerHTML = html;
      chipsEl.querySelectorAll(".category-chip").forEach((btn) => {
        btn.addEventListener("click", () => {
          activeCategory = btn.dataset.cat;
          renderProducts(allProducts, document.getElementById("searchBox").value);
        });
      });
    }

    function renderProducts(products, filter) {
      const contentEl = document.getElementById("content");
      const normalized = (filter || "").toLowerCase().trim();
      let filtered = normalized ? products.filter((p) => p.name.toLowerCase().includes(normalized)) : products;
      if (activeCategory) filtered = filtered.filter((p) => (p.category || "Diğer") === activeCategory);

      if (!filtered.length) {
        contentEl.innerHTML = '<div class="empty-state">Bu isimde bir ürün yok. Farklı bir kelime dene.</div>';
        return;
      }

      const byCategory = {};
      filtered.forEach((p) => {
        const cat = p.category || "Diğer";
        if (!byCategory[cat]) byCategory[cat] = [];
        byCategory[cat].push(p);
      });

      let html = "";
      Object.keys(byCategory).sort().forEach((cat) => {
        if (!activeCategory) html += `<p class="category-label">${escapeHtml(cat)}</p>`;
        byCategory[cat].forEach((p) => {
          const unitLabel = p.unit === "kg" ? "kg" : "adet";
          const qty = cart[p.name] ? cart[p.name].qty : 0;
          const visual = getCategoryVisual(p.category);
          const visualHtml = p.image
            ? `<div class="product-visual" style="background:${visual.color};padding:0;"><img src="${escapeHtml(p.image)}" alt="" style="width:100%;height:100%;object-fit:cover;" /></div>`
            : `<div class="product-visual" style="background:${visual.color};"><i class="fa-solid ${visual.icon}" aria-hidden="true"></i></div>`;
          const isDiscounted = p.catalogDiscount && p.discountedPrice;
          const effectivePrice = isDiscounted ? p.discountedPrice : p.price;
          const priceHtml = isDiscounted
            ? `<p class="product-price"><span class="highlight-price-old">${formatTL(p.price)}</span> ${formatTL(p.discountedPrice)}<span class="product-unit"> / ${unitLabel}</span></p>`
            : `<p class="product-price">${formatTL(p.price)}<span class="product-unit"> / ${unitLabel}</span></p>`;
          html += `
            <div class="product-card">
              ${visualHtml}
              <div class="product-body">
                <p class="product-name">${escapeHtml(p.name)}</p>
                ${priceHtml}
                <div class="qty-stepper" data-name="${escapeHtml(p.name)}" data-price="${effectivePrice}" data-unit="${p.unit}">
                  ${qty > 0 ? `<button class="minus-btn">−</button><span>${qty}</span>` : ""}
                  <button class="add-btn">${qty > 0 ? "+" : "Ekle"}</button>

                </div>
              </div>
            </div>`;
        });
      });
      contentEl.innerHTML = html;

      contentEl.querySelectorAll(".qty-stepper").forEach((el) => {
        const name = el.dataset.name;
        const price = Number(el.dataset.price);
        const unit = el.dataset.unit;
        const addBtn = el.querySelector(".add-btn");
        const minusBtn = el.querySelector(".minus-btn");
        if (addBtn) addBtn.addEventListener("click", () => changeCartQty(name, price, unit, 1));
        if (minusBtn) minusBtn.addEventListener("click", () => changeCartQty(name, price, unit, -1));
      });
    }

    function changeCartQty(name, price, unit, delta) {
      if (!cart[name]) cart[name] = { qty: 0, price, unit };
      cart[name].qty += delta;
      if (cart[name].qty <= 0) delete cart[name];
      updateCartBar();
      renderProducts(allProducts, document.getElementById("searchBox").value);
    }

    function getCartTotal() {
      return Object.values(cart).reduce((sum, item) => sum + item.qty * item.price, 0);
    }
    function getCartCount() {
      return Object.values(cart).reduce((sum, item) => sum + item.qty, 0);
    }

    function updateCartBar() {
      const badge = document.getElementById("cartBarCount");
      const count = getCartCount();
      if (count <= 0) {
        badge.style.display = "none";
      } else {
        badge.style.display = "flex";
        badge.textContent = count > 99 ? "99+" : String(count);
      }
    }

    function openCartSheet() {
      renderCartLines();
      document.getElementById("deliveryStep").style.display = Object.keys(cart).length ? "block" : "none";
      updateFeeSummary();
      document.getElementById("cartSheetOverlay").classList.add("show");
    }
    function closeCartSheet() {
      document.getElementById("cartSheetOverlay").classList.remove("show");
    }

    function renderCartLines() {
      const listEl = document.getElementById("cartLinesList");
      const entries = Object.entries(cart);
      if (!entries.length) {
        listEl.innerHTML = '<p class="empty-cart-note">Sepetin boş — yukarıdan ürün ekleyerek başla.</p>';
        return;
      }
      listEl.innerHTML = entries
        .map(([name, item]) => {
          const unitLabel = item.unit === "kg" ? "kg" : "adet";
          return `
            <div class="cart-line-row">
              <div>
                <div class="cart-line-name">${escapeHtml(name)}</div>
                <div class="cart-line-meta">${item.qty} ${unitLabel} × ${formatTL(item.price)}</div>
              </div>
              <div class="cart-line-total">${formatTL(item.qty * item.price)}</div>
            </div>`;
        })
        .join("");
    }

    function chooseDelivery(mode) {
      deliveryMode = mode;
      document.getElementById("choosePickupBtn").classList.toggle("active", mode === "pickup");
      document.getElementById("chooseCourierBtn").classList.toggle("active", mode === "courier");
      document.getElementById("courierSection").style.display = mode === "courier" ? "block" : "none";
      updateFeeSummary();
    }

    function haversineKm(lat1, lng1, lat2, lng2) {
      const R = 6371;
      const dLat = ((lat2 - lat1) * Math.PI) / 180;
      const dLng = ((lng2 - lng1) * Math.PI) / 180;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos((lat1 * Math.PI) / 180) * Math.cos((lat2 * Math.PI) / 180) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function updateFeeSummary() {
      const summary = document.getElementById("feeSummary");
      const deliveryRow = document.getElementById("feeDeliveryRow");
      const warnEl = document.getElementById("deliveryWarn");
      const sendBtn = document.getElementById("sendOrderBtn");
      const productTotal = getCartTotal();

      document.getElementById("feeProductTotal").textContent = formatTL(productTotal);
      summary.style.display = Object.keys(cart).length ? "block" : "none";
      warnEl.style.display = "none";
      sendBtn.disabled = Object.keys(cart).length === 0;

      if (deliveryMode === "courier") {
        if (!businessLat || !businessLng) {
          deliveryRow.style.display = "none";
          document.getElementById("feeGrandTotal").textContent = formatTL(productTotal);
          warnEl.textContent = "Bu işletme henüz kurye teslimatı için konum ayarlamamış — sipariş verirken kendin fiyat sorman gerekebilir.";
          warnEl.style.display = "block";
          return;
        }
        if (pickedLat == null) {
          deliveryRow.style.display = "none";
          document.getElementById("feeGrandTotal").textContent = formatTL(productTotal);
          warnEl.textContent = "Teslimat ücretinin hesaplanması için lütfen konumunu haritadan işaretle.";
          warnEl.style.display = "block";
          sendBtn.disabled = true;
          return;
        }
        const distanceKm = haversineKm(businessLat, businessLng, pickedLat, pickedLng);
        const fee = Math.round(distanceKm * perKmDeliveryFee * 100) / 100;
        deliveryRow.style.display = "flex";
        document.getElementById("feeDeliveryAmount").textContent = `${formatTL(fee)} (~${distanceKm.toFixed(1)} km)`;
        document.getElementById("feeGrandTotal").textContent = formatTL(productTotal + fee);
      } else {
        deliveryRow.style.display = "none";
        document.getElementById("feeGrandTotal").textContent = formatTL(productTotal);
      }
    }

    function openDeliveryMap() {
      const mapEl = document.getElementById("deliveryMap");
      mapEl.style.display = "block";

      const startLat = businessLat || 39.0;
      const startLng = businessLng || 35.0;

      setTimeout(() => {
        if (!deliveryMap) {
          deliveryMap = L.map("deliveryMap").setView([startLat, startLng], businessLat ? 13 : 6);
          L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OpenStreetMap" }).addTo(deliveryMap);
          deliveryMarker = L.marker([startLat, startLng], { draggable: true }).addTo(deliveryMap);
          deliveryMarker.on("dragend", () => {
            const pos = deliveryMarker.getLatLng();
            pickedLat = pos.lat;
            pickedLng = pos.lng;
            updateFeeSummary();
          });
          deliveryMap.on("click", (e) => {
            deliveryMarker.setLatLng(e.latlng);
            pickedLat = e.latlng.lat;
            pickedLng = e.latlng.lng;
            updateFeeSummary();
          });
        }
        deliveryMap.invalidateSize();

        if (navigator.geolocation && pickedLat == null) {
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              const lat = pos.coords.latitude;
              const lng = pos.coords.longitude;
              deliveryMap.setView([lat, lng], 15);
              deliveryMarker.setLatLng([lat, lng]);
              pickedLat = lat;
              pickedLng = lng;
              updateFeeSummary();
            },
            () => {}
          );
        }
      }, 250);
    }

    async function sendOrder() {
      const customerName = document.getElementById("customerNameInput").value.trim();
      const customerPhone = document.getElementById("customerPhoneInput").value.trim();
      const warnEl = document.getElementById("customerInfoWarn");

      if (!customerName || !customerPhone) {
        warnEl.textContent = "Lütfen adını ve telefon numaranı gir.";
        warnEl.style.display = "block";
        return;
      }
      if (deliveryMode === "courier" && pickedLat == null) {
        warnEl.textContent = "Kurye seçtiysen, lütfen konumunu haritadan işaretle.";
        warnEl.style.display = "block";
        return;
      }
      warnEl.style.display = "none";

      const items = Object.entries(cart).map(([name, item]) => ({ name, qty: item.qty, unit: item.unit }));
      const productTotal = getCartTotal();
      let deliveryFee = 0;
      let distanceKm = null;
      let mapLink = "";
      const addressText = deliveryMode === "courier" ? document.getElementById("addressTextInput").value.trim() : "";

      if (deliveryMode === "courier" && pickedLat != null) {
        distanceKm = haversineKm(businessLat, businessLng, pickedLat, pickedLng);
        deliveryFee = Math.round(distanceKm * perKmDeliveryFee * 100) / 100;
        mapLink = `https://www.google.com/maps?q=${pickedLat},${pickedLng}`;
      }

      const sendBtn = document.getElementById("sendOrderBtn");
      sendBtn.disabled = true;
      sendBtn.textContent = "Gönderiliyor…";

      if (!currentBusinessId) {
        warnEl.textContent = "Sipariş sistemi şu an kullanılamıyor, lütfen daha sonra tekrar dene.";
        warnEl.style.display = "block";
        sendBtn.disabled = false;
        sendBtn.textContent = "Siparişi Gönder";
        return;
      }

      try {
        const res = await fetch(SUBMIT_ORDER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            businessId: currentBusinessId,
            customerName,
            customerPhone,
            items,
            deliveryMode,
            address: addressText,
            mapLink,
            productTotal,
            deliveryFee,
            distanceKm
          })
        });

        if (!res.ok) throw new Error("Sunucu hatası: " + res.status);

        document.querySelector(".receipt").innerHTML = `
          <p class="receipt-title">Siparişin Alındı</p>
          <p class="receipt-subtitle">teşekkürler, ${escapeHtml(customerName)}</p>
          <hr class="receipt-rule" />
          <p style="text-align:center;font-size:14px;color:var(--ink-soft);line-height:1.6;">
            ${escapeHtml(businessName)} siparişini gördü ve en kısa sürede seninle iletişime geçecek.
          </p>
          <div class="receipt-footer-rule"></div>`;

        Object.keys(cart).forEach((k) => delete cart[k]);
        updateCartBar();
      } catch (err) {
        console.error("Sipariş gönderilemedi:", err);
        warnEl.textContent = businessPhone
          ? `Sipariş gönderilemedi. Lütfen tekrar dene, ya da ara: ${businessPhone}`
          : "Sipariş gönderilemedi, lütfen internetini kontrol edip tekrar dene.";
        warnEl.style.display = "block";
        sendBtn.disabled = false;
        sendBtn.textContent = "Siparişi Gönder";
      }
    }

    async function loadCatalog() {
      const businessId = getQueryParam("id");
      currentBusinessId = businessId;
      const contentEl = document.getElementById("content");

      if (!businessId) {
        contentEl.innerHTML = '<div class="error-state">Geçersiz katalog bağlantısı.</div>';
        return;
      }

      try {
        const response = await fetch(`${PUBLIC_CATALOG_URL}?id=${encodeURIComponent(businessId)}`);
        const data = await response.json();

        if (!response.ok || data.error) {
          contentEl.innerHTML = '<div class="error-state">Bu katalog şu an aktif değil ya da bulunamadı.</div>';
          return;
        }

        businessName = data.businessName || "Ürün Kataloğu";
        document.getElementById("businessNameHeader").textContent = businessName;
        businessPhone = data.phone || "";
        businessLat = data.businessLat || null;
        businessLng = data.businessLng || null;
        perKmDeliveryFee = data.perKmDeliveryFee || 0;
        allProducts = data.products || [];

        if (data.businessLogo) {
          const logoImg = document.getElementById("businessLogoImg");
          logoImg.src = data.businessLogo;
          logoImg.style.display = "inline-block";
        }
        if (data.brandColor) applyBrandColor(data.brandColor);

        if (!allProducts.length) {
          contentEl.innerHTML = '<div class="empty-state">Şu an listelenecek ürün yok.</div>';
          return;
        }

        document.getElementById("searchBox").style.display = "block";
        renderHighlightSection("newProductsSection", "newProductsScroll", allProducts.filter((p) => p.catalogNew), false);
        renderHighlightSection("discountSection", "discountScroll", allProducts.filter((p) => p.catalogDiscount), true);
        renderCategoryChips(allProducts);
        renderProducts(allProducts, "");
      } catch (e) {
        console.error("Katalog yüklenemedi:", e);
        contentEl.innerHTML = '<div class="error-state">Katalog yüklenemedi, lütfen daha sonra tekrar dene.</div>';
      }
    }

    document.getElementById("searchBox").addEventListener("input", (e) => renderProducts(allProducts, e.target.value));
    document.getElementById("openCartBtn").addEventListener("click", openCartSheet);
    document.getElementById("closeCartSheetBtn").addEventListener("click", closeCartSheet);
    document.getElementById("choosePickupBtn").addEventListener("click", () => chooseDelivery("pickup"));
    document.getElementById("chooseCourierBtn").addEventListener("click", () => chooseDelivery("courier"));
    document.getElementById("pickOnMapBtn").addEventListener("click", openDeliveryMap);
    document.getElementById("sendOrderBtn").addEventListener("click", sendOrder);
    document.getElementById("cartSheetOverlay").addEventListener("click", (e) => {
      if (e.target.id === "cartSheetOverlay") closeCartSheet();
    });

    loadCatalog();
  </script>
</body>
</html>
